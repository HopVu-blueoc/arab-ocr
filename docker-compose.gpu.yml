# GPU overlay - verified on an RTX 5070 (Blackwell), see docker/api.gpu.Dockerfile's header comment.
# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
#
# Needs the NVIDIA Container Toolkit installed on the host so the Docker
# daemon can hand a GPU to a container at all - this file only asks for one,
# it doesn't install the driver support that makes the ask meaningful.
services:
  worker:
    build:
      dockerfile: docker/api.gpu.Dockerfile
    # A separate tag from the base file's `arabic-ocr-api` is load-bearing,
    # not cosmetic: api/migrate/worker all build from that one tag in
    # docker-compose.yml, and this file only overrides worker's dockerfile,
    # not its image name. Building both files together with a shared tag
    # means whichever Dockerfile finishes last silently overwrites the tag
    # for every service using it - the CPU api/migrate build finishing after
    # this one would leave `worker` running the CPU image with no CUDA at
    # all, despite OCR_DEVICE=gpu:0, and paddle would just never touch a GPU
    # with no error to notice by. Confirmed this actually happens, not
    # theoretical: worker ran python:3.12-slim (no nvidia/cuda base layer at
    # all) after a combined `up -d --build` across both files.
    image: arabic-ocr-worker-gpu
    environment:
      OCR_DEVICE: gpu:0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
