server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # This is a cap on the WHOLE request body, not per file - which is how 20
    # individually-legal 3MB photos used to add up to a 413 the user could do
    # nothing about. It must stay at or above the backend's MAX_REQUEST_MB
    # (100m), with headroom for multipart boundaries and headers;
    # tests/test_limits.py fails if the two drift apart.
    client_max_body_size 128m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploads and OCR polling responses are plain request/response, not
        # long-lived streams - no special buffering/timeout tuning needed
        # beyond nginx's defaults.
    }

    # SPA fallback: any non-file, non-/api/ path serves index.html so
    # client-side routing (and a hard refresh on a deep link) works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
