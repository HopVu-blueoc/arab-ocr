server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads and served images can be several MB (scene photos); the
    # backend's own MAX_UPLOAD_MB is the real gate, this just keeps nginx
    # from rejecting a request before it gets there.
    client_max_body_size 32m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploads and OCR polling responses are plain request/response, not
        # long-lived streams - no special buffering/timeout tuning needed
        # beyond nginx's defaults.
    }

    # SPA fallback: any non-file, non-/api/ path serves index.html so
    # client-side routing (and a hard refresh on a deep link) works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
